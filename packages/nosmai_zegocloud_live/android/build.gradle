group = "com.nosmai.zegocloud_live"
version = "1.0.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

apply plugin: "com.android.library"
// Same Kotlin setup as nosmai_effects_sdk, which every app using this plugin already builds.
apply plugin: "kotlin-android"

// The Effects plugin supplies the native Nosmai SDK at runtime.
def nosmaiSdkVersion = "3.0.7"

android {
    namespace = "com.nosmai.zegocloud_live"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // ZEGO Express runs on API 21+, but the Nosmai GPU path needs OpenGL ES 3 and the
        // thermal API; 24 matches nosmai_effects_sdk's floor with room to spare.
        minSdk = 24
        consumerProguardFiles "consumer-rules.pro"
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

// ZEGO Flutter 3.21 targets API 31 internally. Its Flutter embedding depends on
// AndroidX libraries that require a newer compile SDK.
def zegoPlugin = project(":zego_express_engine")
zegoPlugin.plugins.withId("com.android.library") {
    zegoPlugin.androidComponents.finalizeDsl { dsl ->
        if ((dsl.compileSdk ?: 0) < 36) dsl.compileSdk = 36
    }
}

dependencies {
    compileOnly(zegoPlugin)
    // Packaged at runtime by the nosmai_effects_sdk plugin; needed here only to compile against.
    compileOnly("com.nosmai:nosmai-sdk:${nosmaiSdkVersion}@aar")
}

// The Nosmai AAR is served from its GitHub release. nosmai_effects_sdk registers the same
// repository; registering it here too keeps this module independent of plugin evaluation order.
repositories {
    google()
    mavenCentral()
    ivy {
        name = "nosmaiZegoLiveSdk"
        url = uri("https://github.com/nosmai/nosmai_effects_sdk_android/releases/download")
        patternLayout {
            artifact("v[revision]/[artifact]-[revision].[ext]")
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule("com.nosmai", "nosmai-sdk")
        }
    }
}
